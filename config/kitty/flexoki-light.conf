# vim:ft=kitty

## name:     Flexoki Light
## author:   Steph Ango
## license:  MIT
## upstream: https://stephango.com/flexoki
## blurb:    A high-contrast, ink-friendly color scheme for light mode.



# The basic colors
foreground              #100F0F
background              #FFFCF0
selection_foreground    #FFFCF0
selection_background    #6F6E69

# Cursor colors
cursor                  #100F0F
cursor_text_color       #FFFCF0

# URL underline color when hovering with mouse
url_color               #205EA6

# Kitty window border colors
active_border_color     #205EA6
inactive_border_color   #B7B5AC
bell_border_color       #DA702C

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #FFFCF0
active_tab_background   #205EA6
inactive_tab_foreground #100F0F
inactive_tab_background #E6E4D9
tab_bar_background      #FFFCF0

# Colors for marks (marked text in the terminal)
mark1_foreground #FFFCF0
mark1_background #205EA6
mark2_foreground #FFFCF0
mark2_background #66800B
mark3_foreground #FFFCF0
mark3_background #DA702C

# The 16 terminal colors

# black
color0 #6F6E69
color8 #B7B5AC

# red
color1 #AF3029
color9 #D14A41

# green
color2  #66800B
color10 #879A39

# yellow
color3  #DA702C
color11 #D08A2E

# blue
color4  #205EA6
color12 #4385BE

# magenta
color5  #5E409D
color13 #7A5CAC

# cyan
color6  #3AA99F
color14 #46BDB6

# white
color7  #B7B5AC
color15 #D1CFC3
